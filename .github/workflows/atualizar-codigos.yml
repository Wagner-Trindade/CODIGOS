name: Atualizar códigos jurídicos

on:
  workflow_dispatch:

  schedule:
    - cron: "23 5 * * *"
      timezone: "America/Sao_Paulo"

permissions:
  contents: write

concurrency:
  group: atualizar-codigos-juridicos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: "America/Sao_Paulo"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependências Python
        run: python -m pip install -r requirements.txt

      - name: Instalar Chromium do Playwright
        run: python -m playwright install --with-deps chromium

      - name: Coletar, validar e comparar as normas
        run: python scripts/atualizar_normas.py

      - name: Verificar se houve alteração
        id: alteracoes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- normas/)" ]; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração jurídica detectada."
          else
            echo "mudou=true" >> "$GITHUB_OUTPUT"
            echo "Alteração detectada."
            git status --short -- normas/
          fi

      - name: Versionar alterações
        if: steps.alteracoes.outputs.mudou == 'true'
        shell: bash
        run: |
          git config user.name "legislacao-bot"
          git config user.email "legislacao-bot@users.noreply.github.com"

          git add normas/
          git commit -m "Atualiza legislação em $(date '+%Y-%m-%d')"
          git push
