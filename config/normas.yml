    titulo: "Código Civil"
    urn: "urn:lex:br:federal:lei:2002-01-10;10406"
    referencia:
      tipo: "Lei"
      numero: "10.406"
      ano: 2002
    validacao:
      fragmentos_obrigatorios:
        - "10.406"
        - "Código Civil"
      minimo_caracteres: 150000
      minimo_artigos: 1200

