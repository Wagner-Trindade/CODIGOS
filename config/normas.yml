projeto:
  timezone: "America/Sao_Paulo"

fontes:
  # API oficial de Dados Abertos do Senado, usada para validar a URN
  # e obter metadados estruturados da norma.
  senado_urn: "https://legis.senado.leg.br/dadosabertos/legislacao/urn.json"

  # Portal oficial de normas do Congresso. A aplicação localiza a versão
  # vigente e carrega o texto por sua API pública interna.
  normas_portal: "https://normas.leg.br/"

seguranca:
  http_timeout_segundos: 30
  tentativas_http: 4
  espera_entre_tentativas_segundos: 2
  browser_timeout_ms: 60000

  # Se o novo texto ficar mais de 35% menor que o texto já versionado,
  # o processo falha e preserva a versão anterior.
  reducao_maxima_percentual: 35

normas:
